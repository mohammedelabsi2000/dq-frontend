# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: dq-frontend
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Backend URL followed by /api — entered in the Render dashboard
      - key: VITE_API_BASE_URL
        sync: false
